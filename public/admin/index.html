<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Content Manager | Toneelgroep De Valk</title>
    <!-- Netlify Identity Widget -->
    <script src="https://unpkg.com/netlify-identity-widget@1.9.2/build/netlify-identity-widget.js"></script>
  </head>
  <body>
    <!-- Decap CMS App -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
      // Zorgt ervoor dat Tailwind en Fonts werken in het preview venster
      CMS.registerPreviewStyle("https://cdn.tailwindcss.com");
      CMS.registerPreviewStyle("https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Playfair+Display:wght@400;700&display=swap");

      // Custom Preview voor Voorstellingen
      var VoorstellingPreview = createClass({
        render: function() {
          var entry = this.props.entry;
          var title = entry.getIn(['data', 'title']);
          var date = entry.getIn(['data', 'date']);
          var image = entry.getIn(['data', 'image']);
          var body = this.props.widgetFor('body');

          return h('div', {className: 'bg-white min-h-screen p-8 font-sans'},
            h('div', {className: 'max-w-4xl mx-auto'},
              h('p', {className: 'text-amber-600 font-bold uppercase tracking-widest text-xs mb-4'}, date),
              h('h1', {className: 'text-5xl font-serif text-slate-900 mb-8'}, title),
              image ? h('img', {src: image, className: 'w-full aspect-video object-cover mb-12'}) : null,
              h('div', {className: 'prose prose-lg max-w-none text-slate-700'}, body)
            )
          );
        }
      });

      CMS.registerPreviewTemplate("voorstellingen", VoorstellingPreview);
      
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", user => {
          if (!user) {
            window.netlifyIdentity.on("login", () => {
              document.location.href = "/admin/";
            });
          }
        });
      }
    </script>
  </body>
</html>
