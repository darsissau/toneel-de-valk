<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Content Manager | Toneelgroep De Valk</title>
    <!-- Netlify Identity Widget -->
    <script src="https://unpkg.com/netlify-identity-widget@1.9.2/build/netlify-identity-widget.js"></script>
    
    <style>
      /* Styles voor de CMS UI zelf (niet de preview) */
      .nc-app-layout-main {
        background-color: #f0f0f0 !important;
      }
    </style>
  </head>
  <body>
    <!-- Decap CMS App -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    
    <script>
      // 1. Laad Fonts en Tailwind met Typography plugin
      CMS.registerPreviewStyle("https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap");
      CMS.registerPreviewStyle("https://cdn.tailwindcss.com?plugins=typography");

      // 2. Definieer de kleuren van je website zodat Tailwind ze herkent
      CMS.registerPreviewStyle(`
        @theme {
          --color-accent-gold: #C8A24A;
          --color-primary-text: #1C1C1C;
          --color-bg-ivory: #FCFBF7;
        }
        body {
          background-color: #FCFBF7;
        }
        .preview-body p {
          margin-bottom: 1.5rem;
          line-height: 1.8;
        }
      `, { raw: true });

      // 3. De Preview Component
      var PostPreview = createClass({
        render: function() {
          var entry = this.props.entry;
          var title = entry.getIn(['data', 'title']);
          var date = entry.getIn(['data', 'date']);
          var image = entry.getIn(['data', 'image']);
          var body = this.props.widgetFor('body');

          return h('div', { className: 'bg-[#FCFBF7] min-h-screen p-8 md:p-16 text-[#1C1C1C]' },
            h('div', { className: 'max-w-4xl mx-auto' },
              // Header
              h('div', { className: 'mb-12' },
                h('p', { className: 'text-[#C8A24A] font-bold uppercase tracking-[0.4em] text-[10px] mb-4' }, date || 'Datum nog niet ingesteld'),
                h('h1', { className: 'text-6xl font-serif leading-tight tracking-tighter mb-8' }, title || 'Nieuwe Voorstelling')
              ),
              // Image
              image ? h('div', { className: 'aspect-[21/9] overflow-hidden grayscale mb-12 bg-gray-200' },
                h('img', { src: this.props.getAsset(image).toString(), className: 'w-full h-full object-cover' })
              ) : null,
              // Content
              h('div', { className: 'prose prose-xl prose-serif max-w-none text-primary-text/80 preview-body' }, body)
            )
          );
        }
      });

      // 4. Registreer de templates voor beide collecties
      CMS.registerPreviewTemplate("voorstellingen", PostPreview);
      CMS.registerPreviewTemplate("nieuws", PostPreview);

      // Netlify Identity Login Helper
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", user => {
          if (!user) {
            window.netlifyIdentity.on("login", () => {
              document.location.href = "/admin/";
            });
          }
        });
      }
    </script>
  </body>
</html>
