<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Content Manager | Toneelgroep De Valk</title>
    <script src="https://unpkg.com/netlify-identity-widget@1.9.2/build/netlify-identity-widget.js"></script>
    <style>
      /* Verberg de standaard Decap branding */
      [class^="nc-login-logo"], 
      [class*=" nc-login-logo"],
      svg[width="300"][height="40"] {
        display: none !important;
      }

      /* Eigen styling voor het inlogscherm */
      div[class^="nc-login-container"] {
        background-color: #FCFBF7 !important;
      }

      /* Voeg eigen titel toe boven de login knop */
      div[class^="nc-login-container"]::before {
        content: "TONEELGROEP DE VALK";
        display: block;
        font-family: 'Playfair Display', serif;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 0.2em;
        color: #1C1C1C;
        margin-bottom: 40px;
        text-align: center;
      }

      button[class^="nc-login-button"] {
        background-color: #C8A24A !important;
        color: white !important;
        border-radius: 0 !important;
        text-transform: uppercase !important;
        letter-spacing: 0.1em !important;
        font-weight: 700 !important;
        padding: 12px 24px !important;
        border: none !important;
      }
    </style>
  </head>
  <body>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
      // 1. Laad de Google Fonts
      CMS.registerPreviewStyle("https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap");

      // 2. Definieer alle stijlen handmatig (omdat de Tailwind CDN niet werkt als stylesheet in Decap)
      CMS.registerPreviewStyle(`
        body {
          background-color: #FCFBF7;
          color: #1C1C1C;
          font-family: 'Inter', sans-serif;
          margin: 0;
          padding: 0;
        }
        .preview-container {
          max-width: 800px;
          margin: 0 auto;
          padding: 60px 20px;
        }
        .font-serif {
          font-family: 'Playfair Display', serif;
        }
        .text-gold {
          color: #C8A24A;
        }
        .date-label {
          text-transform: uppercase;
          letter-spacing: 0.4em;
          font-size: 10px;
          font-weight: 700;
          margin-bottom: 20px;
          display: block;
        }
        .main-title {
          font-size: 64px;
          line-height: 1.1;
          margin-bottom: 40px;
          letter-spacing: -0.02em;
        }
        .image-wrapper {
          width: 100%;
          aspect-ratio: 21 / 9;
          overflow: hidden;
          background-color: #eee;
          margin-bottom: 50px;
          filter: grayscale(100%);
        }
        .image-wrapper img {
          width: 100%;
          height: 100%;
          object-fit: cover;
        }
        /* Content styling (Prose) */
        .content-body {
          font-size: 19px;
          line-height: 1.7;
          color: rgba(28, 28, 28, 0.85);
        }
        .content-body h2, .content-body h3 {
          font-family: 'Playfair Display', serif;
          margin-top: 40px;
          margin-bottom: 20px;
          color: #1C1C1C;
        }
        .content-body p {
          margin-bottom: 24px;
        }
        .content-body ul {
          margin-bottom: 24px;
          padding-left: 20px;
        }
        .content-body li {
          margin-bottom: 10px;
        }
        .content-body strong {
          color: #1C1C1C;
        }
      `, { raw: true });

      // 3. De Preview Component
      var PostPreview = createClass({
        render: function() {
          var entry = this.props.entry;
          var title = entry.getIn(['data', 'title']);
          var date = entry.getIn(['data', 'date']);
          var image = entry.getIn(['data', 'image']);
          var body = this.props.widgetFor('body');

          return h('div', { className: 'preview-container' },
            h('p', { className: 'date-label text-gold' }, date || 'Datum nog niet ingesteld'),
            h('h1', { className: 'main-title font-serif' }, title || 'Nieuwe Voorstelling'),
            image ? h('div', { className: 'image-wrapper' },
              h('img', { src: this.props.getAsset(image).toString() })
            ) : null,
            h('div', { className: 'content-body' }, body)
          );
        }
      });

      CMS.registerPreviewTemplate("voorstellingen", PostPreview);
      CMS.registerPreviewTemplate("nieuws", PostPreview);

      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", user => {
          if (!user) {
            window.netlifyIdentity.on("login", () => {
              document.location.href = "/admin/";
            });
          }
        });
      }
    </script>
  </body>
</html>
